[project]
name = "propella-bekko"
version = "0.1.0"
description = "Fast document annotation models (propella-1 label space) for pretraining-data curation"
readme = "README.md"
license = "MIT"
authors = [
    { name = "Kenneth Enevoldsen", email = "kenneth.enevoldsen@cas.au.dk" }
]
requires-python = ">=3.12,<3.13"
dependencies = [
    "huggingface-hub>=2.3.0",
    "pyarrow>=26.0.0",
    "safetensors>=0.8.0",
    "scikit-learn>=1.9.1",
    "torch>=2.8",
    "tqdm>=4.70.1",
    "transformers>=5.21.0",
]

[project.urls]
Repository = "https://github.com/danish-foundation-models/propella-bekko"
Models = "https://huggingface.co/danish-foundation-models/propella-bekko-a25m"
Dataset = "https://huggingface.co/datasets/danish-foundation-models/propella-bekko-data"

[build-system]
requires = ["uv_build>=0.8.22,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.3",
    "ty>=0.0.92",
]
scripts = [
    "httpx>=0.28.1",
    "matplotlib>=3.11.2",
    "pydantic>=2.14.1",
]

[[tool.uv.index]]
name = "pytorch-cu129"
url = "https://download.pytorch.org/whl/cu129"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu129", marker = "sys_platform == 'linux'" }]

[project.scripts]
propella-bekko = "propella_bekko.cli:main"


[tool.ruff]
line-length = 100
target-version = "py312"
# the model cards are rendered documents: the snippets in them are copy-paste examples,
# not code that should be reformatted
extend-exclude = ["models"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501", "E741", "RUF001", "RUF002", "RUF003"]

[tool.ty.environment]
python-version = "3.12"

[tool.ty.rules]
# torch idiom: nn.Module.forward is declared as an attribute
invalid-mutable-override = "ignore"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint.isort]
known-first-party = ["propella_bekko"]
